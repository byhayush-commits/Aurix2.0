<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Faceted crimson triangular logo</title>
  <desc>Three angular crimson shards on a pure black square background.</desc>
  <defs>
    <linearGradient id="top-face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff315e"/>
      <stop offset="0.52" stop-color="#ff174b"/>
      <stop offset="1" stop-color="#e50942"/>
    </linearGradient>
    <linearGradient id="top-left-face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff174d"/>
      <stop offset="0.62" stop-color="#cf0640"/>
      <stop offset="1" stop-color="#a70a3b"/>
    </linearGradient>
    <linearGradient id="deep-face" x1="0" y1="0" x2="1" y2="0.7">
      <stop offset="0" stop-color="#8f0a36"/>
      <stop offset="1" stop-color="#4b0b25"/>
    </linearGradient>
    <linearGradient id="main-face" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ff315d"/>
      <stop offset="0.5" stop-color="#ff164b"/>
      <stop offset="1" stop-color="#f10c45"/>
    </linearGradient>
    <linearGradient id="middle-top-face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff174c"/>
      <stop offset="0.48" stop-color="#e50b43"/>
      <stop offset="1" stop-color="#a90b3a"/>
    </linearGradient>
    <linearGradient id="middle-deep-face" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#a40a3a"/>
      <stop offset="1" stop-color="#590a2a"/>
    </linearGradient>
    <linearGradient id="small-bright-face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2858"/>
      <stop offset="0.55" stop-color="#ff174b"/>
      <stop offset="1" stop-color="#ec0b43"/>
    </linearGradient>
    <linearGradient id="small-left-face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e80d45"/>
      <stop offset="1" stop-color="#a00b39"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#000000"/>

  <!-- Upper shard -->
  <path d="M275 38 L256 170 L187 191 Z" fill="url(#top-left-face)"/>
  <path d="M275 38 L416 303 L256 170 Z" fill="url(#top-face)"/>
  <path d="M187 191 L256 170 L416 303 Z" fill="url(#deep-face)"/>

  <!-- Long lower-left shard -->
  <path d="M166 226 L34 464 L280 324 Z" fill="url(#main-face)"/>
  <path d="M166 226 L280 324 L391 327 Z" fill="url(#middle-top-face)"/>
  <path d="M34 464 L280 324 L391 327 Z" fill="url(#middle-deep-face)"/>

  <!-- Small lower-right shard -->
  <path d="M417 344 L369 402 L478 473 Z" fill="url(#small-bright-face)"/>
  <path d="M417 344 L297 412 L369 402 Z" fill="url(#small-left-face)"/>
  <path d="M297 412 L369 402 L478 473 Z" fill="url(#deep-face)"/>
</svg>
