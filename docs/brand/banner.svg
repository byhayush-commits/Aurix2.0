<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A0A"/>
      <stop offset="0.55" stop-color="#140710"/>
      <stop offset="1" stop-color="#1C0A12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FA2D55" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FA2D55" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="top-face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff315e"/>
      <stop offset="0.52" stop-color="#ff174b"/>
      <stop offset="1" stop-color="#e50942"/>
    </linearGradient>
    <linearGradient id="top-left-face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff174d"/>
      <stop offset="0.62" stop-color="#cf0640"/>
      <stop offset="1" stop-color="#a70a3b"/>
    </linearGradient>
    <linearGradient id="deep-face" x1="0" y1="0" x2="1" y2="0.7">
      <stop offset="0" stop-color="#8f0a36"/>
      <stop offset="1" stop-color="#4b0b25"/>
    </linearGradient>
    <linearGradient id="main-face" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ff315d"/>
      <stop offset="0.5" stop-color="#ff164b"/>
      <stop offset="1" stop-color="#f10c45"/>
    </linearGradient>
    <linearGradient id="middle-top-face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff174c"/>
      <stop offset="0.48" stop-color="#e50b43"/>
      <stop offset="1" stop-color="#a90b3a"/>
    </linearGradient>
    <linearGradient id="middle-deep-face" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#a40a3a"/>
      <stop offset="1" stop-color="#590a2a"/>
    </linearGradient>
    <linearGradient id="small-bright-face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2858"/>
      <stop offset="0.55" stop-color="#ff174b"/>
      <stop offset="1" stop-color="#ec0b43"/>
    </linearGradient>
    <linearGradient id="small-left-face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e80d45"/>
      <stop offset="1" stop-color="#a00b39"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FA2D55"/>
      <stop offset="1" stop-color="#FF9DB1"/>
    </linearGradient>
    <clipPath id="ecgclip">
      <rect x="0" y="-15" width="640" height="110"/>
    </clipPath>
  </defs>

  <rect width="1600" height="680" fill="url(#bg)"/>
  <circle cx="350" cy="340" r="330" fill="url(#glow)"/>

  <!-- Official Aurix mark (same geometry + faces as docs/brand/logo.svg) -->
  <g transform="translate(150,160) scale(0.72)">
    <path d="M275 38 L256 170 L187 191 Z" fill="url(#top-left-face)"/>
    <path d="M275 38 L416 303 L256 170 Z" fill="url(#top-face)"/>
    <path d="M187 191 L256 170 L416 303 Z" fill="url(#deep-face)"/>
    <path d="M166 226 L34 464 L280 324 Z" fill="url(#main-face)"/>
    <path d="M166 226 L280 324 L391 327 Z" fill="url(#middle-top-face)"/>
    <path d="M34 464 L280 324 L391 327 Z" fill="url(#middle-deep-face)"/>
    <path d="M417 344 L369 402 L478 473 Z" fill="url(#small-bright-face)"/>
    <path d="M417 344 L297 412 L369 402 Z" fill="url(#small-left-face)"/>
    <path d="M297 412 L369 402 L478 473 Z" fill="url(#deep-face)"/>
  </g>

  <!-- Wordmark + tagline -->
  <text x="560" y="330" font-family="Outfit, Poppins, Roboto, Helvetica Neue, Arial, sans-serif" font-size="150" font-weight="800" fill="#FFFFFF" letter-spacing="6">Aurix</text>
  <text x="566" y="402" font-family="Outfit, Poppins, Roboto, Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="500" fill="#FF9DB1" letter-spacing="14">LISTEN WITHOUT LIMITS!</text>

  <!-- ECG heartbeat trace: every loop eases in slow, then races, seamless -->
  <g transform="translate(566,452)" clip-path="url(#ecgclip)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; -200 0" keyTimes="0;1" calcMode="spline" keySplines="0.5 0 0.85 0.45" dur="1.6s" repeatCount="indefinite"/>
      <path d="M0 40 H55 L65 32 L75 40 H85 L92 44 L100 6 L108 52 L115 40 H125 L135 28 L150 40 H200
               H255 L265 32 L275 40 H285 L292 44 L300 6 L308 52 L315 40 H325 L335 28 L350 40 H400
               H455 L465 32 L475 40 H485 L492 44 L500 6 L508 52 L515 40 H525 L535 28 L550 40 H600
               H655 L665 32 L675 40 H685 L692 44 L700 6 L708 52 L715 40 H725 L735 28 L750 40 H800"
            fill="none" stroke="url(#trace)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
